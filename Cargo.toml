[package]
name = "cptui"
version = "0.5.0"
edition = "2021"
description = "A terminal-native competitive programming workspace"
license = "MIT"
readme = "README.md"
repository = "https://github.com/TsaH0/cptui"
homepage = "https://github.com/TsaH0/cptui"
keywords = ["competitive", "tui", "companion", "ratatui", "cpp"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "cptui"
path = "src/main.rs"

[dependencies]
ratatui = "0.29"
crossterm = "0.28"
tokio = { version = "1", features = ["full"] }
axum = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
directories = "5"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
anyhow = "1"
thiserror = "1"
clap = { version = "4", features = ["derive"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true